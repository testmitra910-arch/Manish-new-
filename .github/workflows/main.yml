name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle.kts" -o -name "build.gradle" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Remove Google Services References
        shell: bash
        run: |
          set -e

          for FILE in \
            "$PROJECT_DIR/app/build.gradle.kts" \
            "$PROJECT_DIR/build.gradle.kts" \
            "$PROJECT_DIR/settings.gradle.kts"
          do
            if [ -f "$FILE" ]; then
              sed -i '/MissingGoogleServicesStrategy/d' "$FILE"
              sed -i '/com.google.gms.google-services/d' "$FILE"
              sed -i '/com.google.gms.googleServices/d' "$FILE"
            fi
          done

          APP="$PROJECT_DIR/app/build.gradle.kts"

          if [ -f "$APP" ]; then
            python3 - "$APP" <<'PY'
import sys
import re

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

text = re.sub(
    r'(?ms)^[ \t]*gms\s*\{.*?^[ \t]*\}',
    '',
    text
)

text = re.sub(
    r'(?ms)^[ \t]*googleServices\s*\{.*?^[ \t]*\}',
    '',
    text
)

text = re.sub(
    r'(?m)^[ \t]*missingGoogleServicesStrategy\s*=.*$',
    '',
    text
)

with open(path, "w", encoding="utf-8") as f:
    f.write(text)
PY
          fi

      - name: Fix AndroidX
        shell: bash
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^android.enableJetifier=true' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$PROJECT_DIR/gradle.properties"

          grep -q '^org.gradle.configuration-cache=false' \
            "$PROJECT_DIR/gradle.properties" || \
            echo 'org.gradle.configuration-cache=false' >> "$PROJECT_DIR/gradle.properties"

      - name: Add Compose Dependencies
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

required = [
    'implementation("androidx.core:core-ktx:1.15.0")',
    'implementation("androidx.activity:activity-compose:1.10.1")',
    'implementation(platform("androidx.compose:compose-bom:2025.02.00"))',
    'implementation("androidx.compose.ui:ui")',
    'implementation("androidx.compose.ui:ui-tooling-preview")',
    'implementation("androidx.compose.material3:material3")',
    'implementation("androidx.compose.runtime:runtime")',
    'implementation("androidx.compose.foundation:foundation")',
    'implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")',
    'debugImplementation("androidx.compose.ui:ui-tooling")'
]

if "dependencies {" in text:
    pos = text.rfind("}")

    block = "\n\n"
    for dep in required:
        if dep not in text:
            block += "    " + dep + "\n"

    text = text[:pos] + block + text[pos:]

else:
    text += "\n\ndependencies {\n"
    for dep in required:
        text += "    " + dep + "\n"
    text += "}\n"

with open(path, "w", encoding="utf-8") as f:
    f.write(text)
PY

      - name: Enable Compose
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"

          if ! grep -q 'compose = true' "$APP"; then
            python3 - "$APP" <<'PY'
import sys

path = sys.argv[1]

with open(path, "r", encoding="utf-8") as f:
    text = f.read()

if "android {" in text and "compose = true" not in text:
    text = text.replace(
        "android {",
        """android {
    buildFeatures {
        compose = true
    }
""",
        1
    )

with open(path, "w", encoding="utf-8") as f:
    f.write(text)
PY
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Clean
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          gradle clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p apk-output
          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo "APK CREATED:"
          ls -lh apk-output/TEST-MITRA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
