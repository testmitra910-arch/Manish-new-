name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Find Gradle Project
        run: |
          FILE=$(find extracted -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)
          if [ -z "$FILE" ]; then
            FILE=$(find extracted -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) | head -1)
          fi
          if [ -z "$FILE" ]; then
            echo "Gradle project not found"
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          gradle --version

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "APK not found"
            exit 1
          fi
          mkdir -p apk
          cp "$APK" apk/TEST-MITRA-debug.apk
          echo "APK created successfully"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk/TEST-MITRA-debug.apk
