name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find ZIP
        shell: bash
        run: |
          echo "===== ZIP FILES ====="
          find . -maxdepth 2 -type f -iname "*.zip" -print

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Gradle Project
        shell: bash
        run: |
          set -e

          echo "Searching extracted project..."

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project was not found inside ZIP."
            echo ""
            echo "All extracted files:"
            find extracted -type f | sort
            exit 1
          fi

          echo "Android Gradle project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        shell: bash
        run: |
          echo "===== PROJECT DIRECTORY ====="
          echo "$PROJECT_DIR"

          echo ""
          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
