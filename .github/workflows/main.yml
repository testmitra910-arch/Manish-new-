name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Find Android Gradle Project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          SETTINGS_FILE=$(find . -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find . -type f \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle project was found."
            echo ""
            echo "Repository files:"
            find . -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project Files
        shell: bash
        run: |
          echo "===== PROJECT DIRECTORY ====="
          echo "$PROJECT_DIR"

          echo ""
          echo "===== PROJECT FILES ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Check Android Project
        shell: bash
        run: |
          if [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Found settings.gradle"
          elif [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          else
            echo "WARNING: settings.gradle not found"
          fi

          if [ -f "$PROJECT_DIR/build.gradle" ]; then
            echo "Found build.gradle"
          fi

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
          fi

      - name: Clean Project
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle clean --no-daemon --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          echo "===== APK FILES ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
