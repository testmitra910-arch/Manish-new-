name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FILE: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 5 -type f | sort

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \( \
              -name "build.gradle.kts" \
              -o -name "build.gradle" \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Fix Android Build Configuration
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"
          APP="$P/app/build.gradle.kts"

          echo "Project: $P"
          echo "App Gradle file: $APP"

          if [ ! -f "$APP" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            find "$P" -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "===== BEFORE FIX ====="
          cat "$APP"

          # Remove problematic Google Services DSL blocks.
          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove gms { ... } blocks
          text = re.sub(
              r'(?ms)^[ \t]*gms\s*\{.*?^[ \t]*\}\s*',
              '',
              text
          )

          # Remove googleServices { ... } blocks
          text = re.sub(
              r'(?ms)^[ \t]*googleServices\s*\{.*?^[ \t]*\}\s*',
              '',
              text
          )

          # Remove standalone problematic configuration lines.
          text = re.sub(
              r'(?m)^[ \t]*googleServices\s*\{?\s*$',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*missingGoogleServicesStrategy\s*=.*$',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*MissingGoogleServicesStrategy\.[A-Za-z_]+\)?\s*$',
              '',
              text
          )

          # Remove empty lines created by the cleanup.
          text = re.sub(r'\n{3,}', '\n\n', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          # Use a stable Android SDK level.
          sed -i \
            's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' \
            "$APP" || true

          sed -i 's/targetSdk = 36/targetSdk = 35/' "$APP" || true

          # AndroidX configuration.
          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=true' "$P/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=true' "$P/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          grep -q '^org.gradle.configuration-cache=' "$P/gradle.properties" || \
            echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"

          echo "===== AFTER FIX ====="
          cat "$APP"

      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" \
              "$SUPABASE_ANON_KEY" > "$P/.env"

            echo "Supabase secrets configured."

          elif [ -f "$P/.env.example" ]; then

            cp "$P/.env.example" "$P/.env"

            echo "Using .env.example."

          else

            touch "$P/.env"

            echo "No Supabase secrets supplied."

          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          gradle \
            --no-daemon \
            --no-configuration-cache \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            assembleDebug \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK FILES ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo "APK created:"
          echo "$APK"

      - name: Upload TEST MITRA APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
