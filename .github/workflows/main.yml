name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP FILE:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TEST MITRA
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED FILES ====="
          find extracted -maxdepth 6 -type f | sort

      - name: Find Android Gradle Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE=$(find extracted -type f \( \
              -name "build.gradle.kts" \
              -o -name "build.gradle" \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

      - name: Fix Google Services Configuration
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"
          ROOT="$PROJECT_DIR/build.gradle.kts"

          echo "===== APP BUILD FILE ====="
          cat "$APP"

          echo ""
          echo "===== REMOVING GOOGLE SERVICES DSL ====="

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove Google Services import.
          text = re.sub(
              r'(?m)^[ \t]*import\s+com\.google\.gms\.googleServices\.[^\n]*\n?',
              '',
              text
          )

          # Remove MissingGoogleServicesStrategy imports.
          text = re.sub(
              r'(?m)^[ \t]*import\s+.*MissingGoogleServicesStrategy.*\n?',
              '',
              text
          )

          # Remove gms { ... } blocks.
          pattern = re.compile(
              r'(?ms)^[ \t]*gms\s*\{.*?^[ \t]*\}\s*'
          )

          text = pattern.sub('', text)

          # Remove googleServices { ... } blocks.
          pattern = re.compile(
              r'(?ms)^[ \t]*googleServices\s*\{.*?^[ \t]*\}\s*'
          )

          text = pattern.sub('', text)

          # Remove strategy lines.
          text = re.sub(
              r'(?m)^[ \t]*missingGoogleServicesStrategy\s*=.*\n?',
              '',
              text
          )

          text = re.sub(
              r'(?m)^[ \t]*MissingGoogleServicesStrategy\.[A-Za-z_]+.*\n?',
              '',
              text
          )

          # Remove direct googleServices assignments.
          text = re.sub(
              r'(?m)^[ \t]*googleServices\s*=.*\n?',
              '',
              text
          )

          # Remove excessive empty lines.
          text = re.sub(r'\n{3,}', '\n\n', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)

          print("Google Services configuration cleaned.")
          PY

          echo "===== AFTER CLEANUP ====="
          cat "$APP"

      - name: Remove Google Services Plugin If Present
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"
          ROOT="$PROJECT_DIR/build.gradle.kts"
          SETTINGS="$PROJECT_DIR/settings.gradle.kts"

          for FILE in "$APP" "$ROOT" "$SETTINGS"; do

            if [ -f "$FILE" ]; then

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE"

              sed -i \
                '/google-services/d' \
                "$FILE"

              sed -i \
                '/MissingGoogleServicesStrategy/d' \
                "$FILE"

            fi

          done

          echo "Google Services plugin references removed where present."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Show Final Build Files
        shell: bash
        run: |
          echo "===== SETTINGS ====="

          if [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            cat "$PROJECT_DIR/settings.gradle.kts"
          fi

          echo ""
          echo "===== ROOT BUILD ====="

          if [ -f "$PROJECT_DIR/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/build.gradle.kts"
          fi

          echo ""
          echo "===== APP BUILD ====="
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          gradle \
            --no-daemon \
            --no-configuration-cache \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            assembleDebug \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== GENERATED APK ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo "APK READY:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
