name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find TEST MITRA ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TEST MITRA ZIP not found."
            exit 1
          fi

          echo "ZIP FILE: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract TEST MITRA
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP_FILE" -d extracted

          echo "===== EXTRACTED PROJECT ====="
          find extracted -maxdepth 6 -type f | sort

      - name: Find Android Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \( \
            -name "settings.gradle.kts" \
            -o -name "settings.gradle" \
          \) -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \( \
              -name "build.gradle.kts" \
              -o -name "build.gradle" \
            \) -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

      - name: Fix Android Gradle Plugin
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -f "$P/gradle/libs.versions.toml" ]; then
            sed -i \
              's/agp = "9\.1\.1"/agp = "8.9.2"/' \
              "$P/gradle/libs.versions.toml"
          fi

      - name: Fix Google Services Error
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          for FILE in \
            "$P/app/build.gradle.kts" \
            "$P/build.gradle.kts" \
            "$P/settings.gradle.kts"
          do

            if [ -f "$FILE" ]; then

              sed -i \
                '/import com\.google\.gms\.googleServices/d' \
                "$FILE"

              sed -i \
                '/MissingGoogleServicesStrategy/d' \
                "$FILE"

              sed -i \
                '/com\.google\.gms\.google-services/d' \
                "$FILE"

              sed -i \
                '/google-services/d' \
                "$FILE"

            fi

          done

          APP="$P/app/build.gradle.kts"

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Remove gms { ... }
          text = re.sub(
              r'(?ms)^[ \t]*gms\s*\{.*?^[ \t]*\}\s*',
              '',
              text
          )

          # Remove googleServices { ... }
          text = re.sub(
              r'(?ms)^[ \t]*googleServices\s*\{.*?^[ \t]*\}\s*',
              '',
              text
          )

          # Remove strategy configuration.
          text = re.sub(
              r'(?m)^[ \t]*missingGoogleServicesStrategy\s*=.*$',
              '',
              text
          )

          text = re.sub(r'\n{3,}', '\n\n', text)

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

      - name: Add AndroidX and Compose Dependencies
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"

          echo "===== APP BUILD BEFORE ====="
          cat "$APP"

          python3 - "$APP" <<'PY'
          import sys
          import re

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              text = f.read()

          # Enable Compose if android { } exists.
          if "buildFeatures" not in text:
              text = text.replace(
                  "android {",
                  """android {

    buildFeatures {
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.15"
    }
""",
                  1
              )

          dependencies_block = r'''
dependencies {

    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.activity:activity-compose:1.10.1")

    implementation(platform("androidx.compose:compose-bom:2025.02.00"))

    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")

    implementation("androidx.compose.material3:material3")

    implementation("androidx.compose.runtime:runtime")

    implementation("androidx.compose.foundation:foundation")

    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

    debugImplementation("androidx.compose.ui:ui-tooling")
}
'''

          # If dependencies block exists, append required dependencies.
          if re.search(r'(?m)^\s*dependencies\s*\{', text):
              match = re.search(
                  r'(?ms)(^\s*dependencies\s*\{.*?^\s*\})',
                  text
              )

              if match:
                  old = match.group(1)

                  required = [
                      'implementation("androidx.core:core-ktx:1.15.0")',
                      'implementation("androidx.activity:activity-compose:1.10.1")',
                      'implementation(platform("androidx.compose:compose-bom:2025.02.00"))',
                      'implementation("androidx.compose.ui:ui")',
                      'implementation("androidx.compose.ui:ui-tooling-preview")',
                      'implementation("androidx.compose.material3:material3")',
                      'implementation("androidx.compose.runtime:runtime")',
                      'implementation("androidx.compose.foundation:foundation")',
                      'implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")',
                      'debugImplementation("androidx.compose.ui:ui-tooling")'
                  ]

                  additions = []

                  for dep in required:
                      if dep not in old:
                          additions.append("    " + dep)

                  if additions:
                      new = old[:-1] + "\n\n" + "\n".join(additions) + "\n}"
                      text = text.replace(old, new, 1)

          else:
              text += "\n" + dependencies_block

          with open(path, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          echo "===== APP BUILD AFTER ====="
          cat "$APP"

      - name: Fix SDK
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app/build.gradle.kts"

          sed -i \
            's/targetSdk = 36/targetSdk = 35/' \
            "$APP" || true

          sed -i \
            's/compileSdk = 36/compileSdk = 35/' \
            "$APP" || true

          sed -i \
            's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/' \
            "$APP" || true

      - name: Configure AndroidX
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=true' \
            "$P/gradle.properties" || \
            echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=' \
            "$P/gradle.properties" || \
            echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          grep -q '^org.gradle.configuration-cache=' \
            "$P/gradle.properties" || \
            echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"

      - name: Configure Supabase
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then

            printf \
              'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' \
              "$SUPABASE_URL" \
              "$SUPABASE_ANON_KEY" > "$P/.env"

            echo "Supabase configured."

          elif [ -f "$P/.env.example" ]; then

            cp "$P/.env.example" "$P/.env"

            echo "Using .env.example."

          else

            touch "$P/.env"

            echo "No Supabase configuration supplied."

          fi

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Gradle
        shell: bash
        run: |
          gradle --version

      - name: Clean Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

          gradle \
            --no-daemon \
            --no-configuration-cache \
            clean \
            --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --no-configuration-cache \
            assembleDebug \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "===== APK ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find \
            "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" \
            apk-output/TEST-MITRA-debug.apk

          echo "APK READY:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
