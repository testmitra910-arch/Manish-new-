name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found ZIP: $ZIP"

      - name: Extract ZIP
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -o "$ZIP" -d extracted

          echo "ZIP extracted successfully"

      - name: Find Android Project
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1)

          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS")
          else
            BUILD=$(find extracted -type f \
              \( -name "build.gradle.kts" -o -name "build.gradle" \) \
              | head -1)

            if [ -z "$BUILD" ]; then
              echo "ERROR: Gradle project not found"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$BUILD")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Remove Google Services Configuration
        run: |
          set -e

          echo "Removing Google Services references..."

          find "$PROJECT_DIR" -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE
          do
            sed -i \
              -e '/com\.google\.gms\.google-services/d' \
              -e '/com\.google\.gms\.googleServices/d' \
              -e '/MissingGoogleServicesStrategy/d' \
              -e '/googleServices/d' \
              -e '/gms/d' \
              "$FILE"

            echo "Fixed: $FILE"
          done

      - name: Remove Google Services Plugin
        run: |
          set -e

          find "$PROJECT_DIR" -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 |
          while IFS= read -r -d '' FILE
          do
            sed -i \
              -e '/google-services/d' \
              -e '/GoogleServices/d' \
              -e '/googleServices/d' \
              "$FILE"
          done

          echo "Google Services plugin references removed"

      - name: Show App Gradle
        run: |
          echo "================================"
          echo "APP BUILD.GRADLE"
          echo "================================"

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            cat "$PROJECT_DIR/app/build.gradle"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Check Gradle
        run: |
          cd "$PROJECT_DIR"
          gradle --version

      - name: Clean Project
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle clean \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Build Debug APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace

      - name: Find APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" |
            head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "================================"

          ls -lh apk-output/TEST-MITRA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
