name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          echo "ZIP found: $ZIP"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Fix Gradle configuration
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Checking project..."

          if [ -f "$P/gradle/libs.versions.toml" ]; then

            sed -i 's/agp = "9\.1\.1"/agp = "8.9.2"/g' \
              "$P/gradle/libs.versions.toml"

            echo "AGP adjusted."

          fi

          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              's/compileSdk { version = release(36) { minorApiLevel = 1 } }/compileSdk = 35/g' \
              "$P/app/build.gradle.kts"

            sed -i \
              's/targetSdk = 36/targetSdk = 35/g' \
              "$P/app/build.gradle.kts"

            # Remove broken Google Services strategy
            sed -i \
              '/MissingGoogleServicesStrategy/d' \
              "$P/app/build.gradle.kts"

            sed -i \
              '/^[[:space:]]*googleServices[[:space:]]*{/d' \
              "$P/app/build.gradle.kts"

            echo "app/build.gradle.kts adjusted."

          fi

          touch "$P/gradle.properties"

          grep -q '^android.useAndroidX=' "$P/gradle.properties" \
            || echo 'android.useAndroidX=true' >> "$P/gradle.properties"

          grep -q '^android.enableJetifier=' "$P/gradle.properties" \
            || echo 'android.enableJetifier=true' >> "$P/gradle.properties"

          sed -i \
            's/^org.gradle.configuration-cache=true$/org.gradle.configuration-cache=false/' \
            "$P/gradle.properties"

          grep -q '^org.gradle.configuration-cache=' "$P/gradle.properties" \
            || echo 'org.gradle.configuration-cache=false' >> "$P/gradle.properties"

      - name: Remove KSP plugin from app
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              '/id[[:space:]]*(["'\'']com.google.devtools.ksp["'\''])/d' \
              "$P/app/build.gradle.kts"

            sed -i \
              '/alias[[:space:]]*(.*ksp.*)/d' \
              "$P/app/build.gradle.kts"

            sed -i \
              '/^[[:space:]]*ksp[[:space:]]*{/d' \
              "$P/app/build.gradle.kts"

            echo "KSP plugin configuration removed from app."

          fi

      - name: Remove KSP dependencies
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              '/^[[:space:]]*ksp[[:space:]]*(/d' \
              "$P/app/build.gradle.kts"

            sed -i \
              '/^[[:space:]]*ksp[[:space:]]*"/d' \
              "$P/app/build.gradle.kts"

            echo "KSP dependencies cleaned."

          fi

      - name: Show Gradle files
        shell: bash
        run: |
          echo "===== PROJECT ====="
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) \
            | sort

          echo "===== APP BUILD FILE ====="

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            cat "$PROJECT_DIR/app/build.gradle.kts"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              clean \
              assembleDebug

          else

            gradle \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              clean \
              assembleDebug

          fi

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh apk-output/TEST-MITRA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
