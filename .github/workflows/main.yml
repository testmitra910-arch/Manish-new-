name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Android Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"

            if [ -f "$dir/settings.gradle" ] || \
               [ -f "$dir/settings.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) \
          ! -path "./.git/*" \
          ! -path "*/build/*")

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Repository files:"
            find . -maxdepth 4 -type f | sort | head -300
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show project files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "===== PROJECT ====="
          pwd
          echo "===== FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.gradle/*" \
            ! -path "./build/*" \
            | sort

      - name: Make Gradle executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Check Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean --no-daemon
          else
            gradle clean --no-daemon
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -e

          echo "Building TEST MITRA APK..."

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --no-build-cache
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --no-build-cache
          fi

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          APK="$(find . -type f \
            -name "*.apk" \
            ! -path "*/build/intermediates/*" \
            | head -1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: |
            ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
