name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Find Android Gradle Project
        id: project
        shell: bash
        run: |
          set -e

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r settings_file; do

            DIR="$(dirname "$settings_file")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              ! -path "./.git/*"
          )

          if [ -z "$PROJECT_DIR" ]; then

            echo "ERROR: No Gradle project found."

            echo "Repository structure:"
            find . -maxdepth 5 -type f \
              ! -path "./.git/*" \
              | sort

            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "================================"
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "================================"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Project Files
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 4 -type f \
            ! -path "./.gradle/*" \
            ! -path "./build/*" \
            | sort

      - name: Make Gradle Executable
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Check Gradle
        working-directory: ${{ steps.project.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Clean Project
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -e

          if [ -f "./gradlew" ]; then

            ./gradlew clean \
              --no-daemon \
              --stacktrace

          else

            gradle clean \
              --no-daemon \
              --stacktrace

          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          CI: true
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g"
        run: |
          set -e

          echo "================================"
          echo "BUILDING TEST MITRA APK"
          echo "================================"

          if [ -f "./gradlew" ]; then

            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --no-build-cache

          else

            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --no-build-cache

          fi

      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK="$(find . \
            -type f \
            -name "*.apk" \
            ! -path "*/build/intermediates/*" \
            | head -n 1)"

          if [ -z "$APK" ]; then

            echo "ERROR: APK was not generated."

            echo ""
            echo "All APK files:"
            find . -type f -name "*.apk" -print

            exit 1
          fi

          echo "================================"
          echo "APK FOUND:"
          echo "$APK"
          echo "================================"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-APK
          path: ${{ steps.project.outputs.project_dir }}/${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 7
