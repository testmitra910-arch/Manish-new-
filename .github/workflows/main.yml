name: Build TEST MITRA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build TEST MITRA APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project found:"
          echo "$PROJECT_DIR"

      - name: Fix Gradle files
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Fixing Gradle configuration..."

          # ------------------------------------------------
          # Remove KSP plugin
          # ------------------------------------------------

          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              '/com.google.devtools.ksp/d' \
              "$P/app/build.gradle.kts"

            # Remove EVERY line containing ksp(...)
            sed -i \
              '/ksp[[:space:]]*(/d' \
              "$P/app/build.gradle.kts"

            # Remove EVERY dependency line using ksp
            sed -i \
              '/^[[:space:]]*ksp[[:space:]]*"/d' \
              "$P/app/build.gradle.kts"

            # Remove ksp blocks
            sed -i \
              '/^[[:space:]]*ksp[[:space:]]*{/d' \
              "$P/app/build.gradle.kts"

          fi

          # ------------------------------------------------
          # Remove broken googleServices configuration
          # ------------------------------------------------

          if [ -f "$P/app/build.gradle.kts" ]; then

            sed -i \
              '/MissingGoogleServicesStrategy/d' \
              "$P/app/build.gradle.kts"

            sed -i \
              '/googleServices[[:space:]]*{/d' \
              "$P/app/build.gradle.kts"

          fi

          # ------------------------------------------------
          # Gradle properties
          # ------------------------------------------------

          touch "$P/gradle.properties"

          if ! grep -q '^android.useAndroidX=' "$P/gradle.properties"; then
            echo 'android.useAndroidX=true' >> "$P/gradle.properties"
          fi

          if ! grep -q '^android.enableJetifier=' "$P/gradle.properties"; then
            echo 'android.enableJetifier=true' >> "$P/gradle.properties"
          fi

          # Disable configuration cache
          sed -i \
            '/^org.gradle.configuration-cache=/d' \
            "$P/gradle.properties"

          echo 'org.gradle.configuration-cache=false' \
            >> "$P/gradle.properties"

          echo "Gradle files fixed."

      - name: Verify KSP is removed
        shell: bash
        run: |
          set -e

          P="$PROJECT_DIR"

          echo "Searching for remaining KSP references..."

          if grep -RniE \
            'com\.google\.devtools\.ksp|[^A-Za-z]ksp[[:space:]]*\(' \
            "$P/app/build.gradle.kts"; then

            echo ""
            echo "ERROR: KSP reference still exists."
            exit 1

          fi

          echo "KSP references successfully removed."

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x ./gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              clean \
              assembleDebug

          else

            gradle \
              --no-daemon \
              --no-configuration-cache \
              --stacktrace \
              clean \
              assembleDebug

          fi

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          mkdir -p apk-output

          cp "$APK" apk-output/TEST-MITRA-debug.apk

          echo ""
          echo "======================================"
          echo "       APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""

          ls -lh apk-output/TEST-MITRA-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEST-MITRA-debug-apk
          path: apk-output/TEST-MITRA-debug.apk
          if-no-files-found: error
          retention-days: 30
